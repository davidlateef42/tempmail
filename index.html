<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #111827;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .app {
            width: 90%;
            max-width: 420px;
            margin: 40px auto;
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h3 {
            margin-top: 0;
        }

        #emailBox {
            background: #0b1220;
            padding: 14px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
            word-break: break-all;
        }

        #timer {
            margin: 10px 0;
            color: #fbbf24;
            font-size: 14px;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .generate {
            background: #22c55e;
            color: black;
        }

        .copy {
            background: #3b82f6;
            color: white;
        }

        .refresh {
            background: #6b7280;
            color: white;
        }

        .inbox {
            margin-top: 15px;
            background: #0b1220;
            padding: 10px;
            border-radius: 10px;
            height: 180px;
            overflow-y: auto;
            text-align: left;
        }

        .mail {
            background: #1f2937;
            margin: 6px 0;
            padding: 9px;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>Temp Mail Pro</header>

    <div class="app">

        <h3>Your Temporary Email</h3>

        <div id="emailBox">
            Click generate to create email
        </div>

        <div id="timer">
            Time left: 10:00
        </div>

        <button class="generate" onclick="generateEmail()">
            Generate Email
        </button>

        <button class="copy" onclick="copyEmail()">
            Copy Email
        </button>

        <button class="refresh" onclick="refreshInbox()">
            Refresh Inbox
        </button>

        <h4 id="inboxTitle">Inbox (0)</h4>

        <div class="inbox" id="inbox">
            No emails yet...
        </div>

    </div>

    <script>
        let countdown;
        let inboxTimer;
        let time = 600;

        function generateEmail() {
            clearInterval(inboxTimer);

            let random = Math.random()
                .toString(36)
                .substring(2, 10);

            let email = random + "@tempmailpro.com";

            document.getElementById("emailBox").innerText = email;

            startTimer();
            startInboxSimulation();
        }

        function copyEmail() {
            let email = document.getElementById("emailBox").innerText;

            if (email.includes("Click generate")) {
                alert("Generate an email first!");
                return;
            }

            navigator.clipboard.writeText(email)
                .then(() => {
                    alert("Email copied!");
                })
                .catch(() => {
                    alert("Copy failed. Please copy it manually.");
                });
        }

        function startTimer() {
            clearInterval(countdown);

            time = 600;

            updateTimer();

            countdown = setInterval(() => {
                time--;

                updateTimer();

                if (time <= 0) {
                    clearInterval(countdown);
                    document.getElementById("timer").innerText = "Expired";
                }
            }, 1000);
        }

        function updateTimer() {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;

            document.getElementById("timer").innerText =
                "Time left: " +
                minutes +
                ":" +
                (seconds < 10 ? "0" + seconds : seconds);
        }

        function startInboxSimulation() {
            let inbox = document.getElementById("inbox");

            inbox.innerHTML = "";
            document.getElementById("inboxTitle").innerText = "Inbox (0)";

            let messages = [
                "Welcome to Temp Mail Pro",
                "Your verification code is " +
                    Math.floor(100000 + Math.random() * 900000),
                "New login detected",
                "Security alert: temporary inbox active"
            ];

            let i = 0;

            function addMessage() {
                if (i < messages.length) {
                    let div = document.createElement("div");

                    div.className = "mail";
                    div.innerText = messages[i];

                    inbox.appendChild(div);

                    i++;

                    document.getElementById("inboxTitle").innerText =
                        "Inbox (" + i + ")";
                } else {
                    clearInterval(inboxTimer);
                }
            }

            addMessage();

            inboxTimer = setInterval(addMessage, 4000);
        }

        function refreshInbox() {
            let inbox = document.getElementById("inbox");

            let div = document.createElement("div");

            div.className = "mail";

            div.innerText =
                "Inbox refreshed at " +
                new Date().toLocaleTimeString();

            inbox.appendChild(div);

            let count =
                inbox.getElementsByClassName("mail").length;

            document.getElementById("inboxTitle").innerText =
                "Inbox (" + count + ")";
        }
    </script>

</body>
</html>
