<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temp Mail Pro</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

.email-box {
    background: #f0f2f5;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    margin: 15px 0;
    word-break: break-all;
}

button {
    padding: 12px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #222;
    color: white;
}

button:hover {
    opacity: 0.9;
}

.timer {
    text-align: center;
    font-size: 20px;
    margin: 15px;
}

.status {
    text-align: center;
    margin: 10px;
    color: #555;
}

.inbox-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.inbox-count {
    background: #222;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 14px;
}

.last-checked {
    text-align: right;
    color: #777;
    font-size: 12px;
    margin-bottom: 10px;
}

.message {
    background: #f7f7f7;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    transition: 0.2s;
}

.message:hover {
    background: #eeeeee;
}

.new-label {
    display: inline-block;
    background: #2196f3;
    color: white;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    margin-left: 5px;
}

.received-time {
    color: #777;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

<h1>📧 Temp Mail Pro</h1>

<p style="text-align:center;">
    Your Temporary Email
</p>

<div class="email-box" id="email">
    Click "Generate Email"
</div>

<div class="timer" id="timer">
    60:00
</div>

<div style="text-align:center;">

    <button onclick="generateEmail()">
        Generate Email
    </button>

    <button onclick="copyEmail()">
        Copy Email
    </button>

    <button onclick="refreshInbox()">
        Refresh Inbox
    </button>

</div>

<div class="status" id="status">
    No email generated yet.
</div>

<div class="inbox-header">

    <h2>
        Inbox
        <span class="inbox-count" id="inboxCount">
            0
        </span>
    </h2>

</div>

<div class="last-checked" id="lastChecked">
    Not checked yet
</div>

<div id="inbox">
    Your messages will appear here.
</div>

</div>

<script>

const API = "https://mailboxtemp.com";


// ========================================
// READ / UNREAD SYSTEM
// ========================================

function isMessageRead(messageId) {

    const readMessages = JSON.parse(
        localStorage.getItem("readMessages") || "[]"
    );

    return readMessages.includes(String(messageId));
}


function markMessageAsRead(messageId) {

    const readMessages = JSON.parse(
        localStorage.getItem("readMessages") || "[]"
    );

    if (!readMessages.includes(String(messageId))) {

        readMessages.push(String(messageId));

    }

    localStorage.setItem(
        "readMessages",
        JSON.stringify(readMessages)
    );
}


// ========================================
// MAIN VARIABLES
// ========================================

let currentEmail = null;

let countdown;

let inboxTimer;


// ========================================
// GENERATE EMAIL
// ========================================

async function generateEmail() {

    const status =
        document.getElementById("status");

    status.textContent =
        "Creating your temporary email...";

    try {

        const response = await fetch(
            API + "/api/inbox/generate",
            {
                method: "POST"
            }
        );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Could not create inbox"
            );

        }

        currentEmail =
            data.address;

        document.getElementById("email")
            .textContent =
            currentEmail;

        status.textContent =
            "Email created successfully!";

        document.getElementById("inbox")
            .innerHTML =
            "Waiting for incoming messages...";

        document.getElementById("inboxCount")
            .textContent =
            "0";

        document.getElementById("lastChecked")
            .textContent =
            "Not checked yet";

        startTimer(3600);

        await checkInbox();

        clearInterval(inboxTimer);

        inboxTimer =
            setInterval(
                checkInbox,
                5000
            );

    } catch (error) {

        console.error(error);

        status.textContent =
            "Could not create email: " +
            error.message;

    }

}


// ========================================
// CHECK INBOX
// ========================================

async function checkInbox() {

    if (!currentEmail) return;

    try {

        const response = await fetch(
            API + "/api/inbox/" +
            encodeURIComponent(currentEmail) +
            "/emails"
        );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Inbox error"
            );

        }

        const inbox =
            document.getElementById("inbox");

        const messages =
            data.emails || [];

        console.log(
            "FULL EMAIL DATA:",
            data.emails
        );


        // ========================================
        // UPDATE LAST CHECKED
        // ========================================

        const now =
            new Date();

        document.getElementById("lastChecked")
            .textContent =
            "Last checked: " +
            now.toLocaleTimeString();


        // ========================================
        // NO MESSAGES
        // ========================================

        if (messages.length === 0) {

            document.getElementById("inboxCount")
                .textContent =
                "0";

            inbox.innerHTML =
                "No messages yet. Waiting for new mail...";

            return;

        }


        // ========================================
        // COUNT UNREAD MESSAGES
        // ========================================

        const unreadCount =
            messages.filter(
                message =>
                    !isMessageRead(message.id)
            ).length;


        document.getElementById("inboxCount")
            .textContent =
            unreadCount;


        // ========================================
        // CLEAR INBOX
        // ========================================

        inbox.innerHTML = "";


        // ========================================
        // DISPLAY MESSAGES
        // ========================================

        messages.forEach(message => {

            const div =
                document.createElement("div");

            div.className =
                "message";


            // ========================================
            // UNREAD STYLE
            // ========================================

            const unread =
                !isMessageRead(message.id);


            if (unread) {

                div.style.borderLeft =
                    "5px solid #2196f3";

            }


            div.style.cursor =
                "pointer";


            // ========================================
            // NEW LABEL
            // ========================================

            const newLabel =
                unread
                ? '<span class="new-label">NEW</span>'
                : "";


            // ========================================
            // RECEIVED TIME
            // ========================================

            const receivedValue =
                message.received_at ||
                message.created_at ||
                message.timestamp ||
                message.date ||
                message.sent_at;


            let receivedTime = "";


            if (receivedValue) {

                const parsedDate =
                    new Date(receivedValue);

                if (!isNaN(parsedDate)) {

                    receivedTime =
                        '<br><span class="received-time">' +
                        '🕐 Received: ' +
                        parsedDate.toLocaleString() +
                        '</span>';

                }

            }


            // ========================================
            // MESSAGE CONTENT
            // ========================================

            div.innerHTML = `

                <strong>

                    ${escapeHtml(
                        message.subject ||
                        "No subject"
                    )}

                </strong>

                ${newLabel}

                <br>

                From:

                ${escapeHtml(
                    message.from_address ||
                    "Unknown"
                )}

                ${
                    message.otp_code
                    ? "<br><strong>OTP: " +
                      escapeHtml(
                          message.otp_code
                      ) +
                      "</strong>"
                    : ""
                }

                ${receivedTime}

                <br><br>

                <span style="color:#555;">

                ${escapeHtml(
    message.preview ||
    message.snippet ||
    message.body ||
    message.text ||
    message.content ||
    message.text_body ||
    message.body_text ||
    message.message ||
    "Message received — click to open."
)}

                </span>

                <br><br>

                <strong style="color:#222;">

                    Click to open →

                </strong>

            `;


            // ========================================
            // DELETE FROM INBOX
            // ========================================

            const inboxDeleteButton =
                document.createElement("button");

            inboxDeleteButton.textContent =
                "🗑️ Delete";

            inboxDeleteButton.style.background =
                "#c62828";

            inboxDeleteButton.style.marginTop =
                "10px";


            inboxDeleteButton.onclick =
                async function(event) {

                    event.stopPropagation();

                    try {

                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                ),
                                {
                                    method: "DELETE"
                                }
                            );

                        const data =
                            await response.json();

                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not delete email"
                            );

                        }

                        div.remove();


                        // Update unread count
                        const currentCount =
                            parseInt(
                                document
                                .getElementById(
                                    "inboxCount"
                                )
                                .textContent
                            ) || 0;


                        if (
                            unread &&
                            currentCount > 0
                        ) {

                            document
                            .getElementById(
                                "inboxCount"
                            )
                            .textContent =
                            currentCount - 1;

                        }

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not delete this email: " +
                            error.message
                        );

                    }

                };


            div.appendChild(
                inboxDeleteButton
            );


            // ========================================
            // OPEN MESSAGE
            // ========================================

            div.onclick =
                async function() {

                    try {

                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                )
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not open email"
                            );

                        }


                        const email =
                            data.email;


                        // ========================================
                        // MARK AS READ
                        // ========================================

                        markMessageAsRead(
                            message.id
                        );

                        div.style.borderLeft =
                            "";


                        // Update inbox count
                        const countElement =
                            document.getElementById(
                                "inboxCount"
                            );

                        const currentCount =
                            parseInt(
                                countElement.textContent
                            ) || 0;

                        if (currentCount > 0) {

                            countElement.textContent =
                                currentCount - 1;

                        }


                        // ========================================
                        // CREATE MESSAGE WINDOW
                        // ========================================

                        const fullMessage =
                            document.createElement(
                                "div"
                            );


                        fullMessage.style.position =
                            "fixed";

                        fullMessage.style.top =
                            "0";

                        fullMessage.style.left =
                            "0";

                        fullMessage.style.width =
                            "100%";

                        fullMessage.style.height =
                            "100%";

                        fullMessage.style.background =
                            "rgba(0,0,0,0.6)";

                        fullMessage.style.display =
                            "flex";

                        fullMessage.style.alignItems =
                            "center";

                        fullMessage.style.justifyContent =
                            "center";

                        fullMessage.style.zIndex =
                            "9999";


                        fullMessage.innerHTML = `

                            <div style="
                                background:white;
                                width:90%;
                                max-width:550px;
                                max-height:80%;
                                overflow:auto;
                                padding:20px;
                                border-radius:15px;
                            ">

                                <h2>

                                    ${escapeHtml(
                                        email.subject ||
                                        "No subject"
                                    )}

                                </h2>

                                <p>

                                    <strong>
                                        From:
                                    </strong>

                                    ${escapeHtml(
                                        email.from_address ||
                                        "Unknown"
                                    )}

                                </p>

                                ${
                                    email.otp_code
                                    ? `<p>
                                        <strong>
                                            OTP:
                                        </strong>

                                        ${escapeHtml(
                                            email.otp_code
                                        )}

                                      </p>`
                                    : ""
                                }

                                <hr>

                                <p style="
                                    white-space:pre-wrap;
                                    line-height:1.6;
                                ">

                                    ${escapeHtml(
                                        email.body_text ||
                                        email.body ||
                                        email.text ||
                                        "No message content available."
                                    )}

                                </p>

                                <button
                                    style="
                                        width:100%;
                                        margin-top:15px;
                                    "
                                >
                                    Close
                                </button>

                            </div>

                        `;


                        document.body.appendChild(
                            fullMessage
                        );


                        // ========================================
                        // CLOSE BUTTON
                        // ========================================

                        const closeButton =
                            fullMessage.querySelector(
                                "button"
                            );


                        closeButton.onclick =
                            function() {

                                fullMessage.remove();

                            };


                        // ========================================
                        // DELETE MESSAGE BUTTON
                        // ========================================

                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.textContent =
                            "🗑️ Delete Message";


                        deleteButton.style.width =
                            "100%";

                        deleteButton.style.marginTop =
                            "10px";

                        deleteButton.style.background =
                            "#c62828";


                        deleteButton.onclick =
                            async function() {

                                try {

                                    const response =
                                        await fetch(
                                            API +
                                            "/api/email/" +
                                            encodeURIComponent(
                                                currentEmail
                                            ) +
                                            "/" +
                                            encodeURIComponent(
                                                message.id
                                            ),
                                            {
                                                method:
                                                    "DELETE"
                                            }
                                        );


                                    const data =
                                        await response.json();


                                    if (
                                        !response.ok ||
                                        !data.ok
                                    ) {

                                        throw new Error(
                                            data.error ||
                                            "Could not delete email"
                                        );

                                    }


                                    fullMessage.remove();

                                    div.remove();

                                } catch (error) {

                                    console.error(
                                        error
                                    );

                                    alert(
                                        "Could not delete this email: " +
                                        error.message
                                    );

                                }

                            };


                        fullMessage
                            .querySelector("div")
                            .appendChild(
                                deleteButton
                            );


                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not open this email: " +
                            error.message
                        );

                    }

                };


            inbox.appendChild(div);

        });

    } catch (error) {

        console.error(error);

    }

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


// ========================================
// COPY EMAIL
// ========================================

function copyEmail() {

    if (!currentEmail) {

        alert(
            "Generate an email first."
        );

        return;

    }

    navigator.clipboard.writeText(
        currentEmail
    );

    document.getElementById("status")
        .textContent =
        "Email copied!";

}


// ========================================
// MANUAL REFRESH
// ========================================

function refreshInbox() {

    if (!currentEmail) {

        document.getElementById("status")
            .textContent =
            "Generate an email first.";

        return;

    }

    document.getElementById("status")
        .textContent =
        "Refreshing inbox...";

    checkInbox().then(() => {

        document.getElementById("status")
            .textContent =
            "Inbox refreshed!";

    });

}


// ========================================
// TIMER
// ========================================

function startTimer(seconds) {

    clearInterval(countdown);

    updateTimer(seconds);


    countdown =
        setInterval(() => {

            seconds--;

            updateTimer(seconds);


            if (seconds <= 0) {

                clearInterval(
                    countdown
                );

                clearInterval(
                    inboxTimer
                );

                document.getElementById(
                    "status"
                ).textContent =
                    "This temporary email has expired.";

            }

        }, 1000);

}


// ========================================
// UPDATE TIMER
// ========================================

function updateTimer(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(remainingSeconds)
            .padStart(2, "0");

}

</script>

</body>
</html>
