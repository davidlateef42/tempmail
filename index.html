<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Mail Pro</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

.email-box {
    background: #f0f2f5;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    margin: 15px 0;
    word-break: break-all;
}

button {
    padding: 12px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #222;
    color: white;
}

button:hover {
    opacity: 0.85;
}

.timer {
    text-align: center;
    font-size: 20px;
    margin: 15px;
}

.status {
    text-align: center;
    margin: 10px;
    color: #555;
}

.message {
    background: #f7f7f7;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
}

.small {
    font-size: 13px;
    color: #777;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>📧 Temp Mail Pro</h1>

<p style="text-align:center;">Your Temporary Email</p>

<div class="email-box" id="email">
    Click "Generate Email"
</div>

<div class="timer" id="timer">10:00</div>

<div style="text-align:center;">
    <button onclick="generateEmail()">Generate Email</button>
    <button onclick="copyEmail()">Copy Email</button>
    <button onclick="refreshInbox()">Refresh Inbox</button>
</div>

<div class="status" id="status">
    No email generated yet.
</div>

<h2>Inbox</h2>

<div id="inbox">
    Your messages will appear here.
</div>

<p class="small">
    Temp Mail Pro — Real temporary email powered by Mail.tm
</p>

</div>

<script>

const API = "https://api.mail.tm";

let token = null;
let currentEmail = null;
let password = null;

let countdown;
let inboxTimer;

async function generateEmail() {

    const status = document.getElementById("status");

    status.textContent = "Creating your temporary email...";

    try {

        // Get available domains
        const domainResponse = await fetch(API + "/domains?page=1");

        if (!domainResponse.ok) {
            throw new Error("Could not get email domains");
        }

        const domainData = await domainResponse.json();

        if (!domainData["hydra:member"] || domainData["hydra:member"].length === 0) {
            throw new Error("No email domain available");
        }

        const domain = domainData["hydra:member"][0].domain;

        // Create random username
        const username =
            "user" +
            Math.random().toString(36).substring(2, 10);

        currentEmail = username + "@" + domain;

        password =
            Math.random().toString(36).substring(2, 12) +
            "A1!";

        // Create account
        const accountResponse = await fetch(API + "/accounts", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                address: currentEmail,
                password: password
            })

        });

        if (!accountResponse.ok) {
            throw new Error("Could not create email account");
        }

        // Login
        const tokenResponse = await fetch(API + "/token", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                address: currentEmail,
                password: password
            })

        });

        if (!tokenResponse.ok) {
            throw new Error("Could not login to email account");
        }

        const tokenData = await tokenResponse.json();

        token = tokenData.token;

        document.getElementById("email").textContent = currentEmail;

        status.textContent = "Email created successfully!";

        document.getElementById("inbox").innerHTML =
            "Waiting for incoming messages...";

        startTimer();

        await checkInbox();

        clearInterval(inboxTimer);

        inboxTimer = setInterval(checkInbox, 5000);

    } catch (error) {

        console.error(error);

        status.textContent =
            "Could not create email. Please try again.";

    }
}


async function checkInbox() {

    if (!token) return;

    try {

        const response = await fetch(API + "/messages", {

            headers: {
                "Authorization": "Bearer " + token
            }

        });

        if (!response.ok) {
            throw new Error("Inbox request failed");
        }

        const data = await response.json();

        const inbox = document.getElementById("inbox");

        const messages = data["hydra:member"] || [];

        if (messages.length === 0) {

            inbox.innerHTML =
                "No messages yet. Waiting for new mail...";

            return;
        }

        inbox.innerHTML = "";

        messages.forEach(message => {

            const div = document.createElement("div");

            div.className = "message";

            div.innerHTML = `
                <strong>${escapeHtml(message.subject || "No subject")}</strong>
                <br>
                From: ${escapeHtml(
                    message.from?.address || "Unknown sender"
                )}
            `;

            inbox.appendChild(div);

        });

    } catch (error) {

        console.error(error);

    }
}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function copyEmail() {

    if (!currentEmail) {

        alert("Generate an email first.");

        return;

    }

    navigator.clipboard.writeText(currentEmail);

    document.getElementById("status").textContent =
        "Email copied!";

}


function refreshInbox() {

    if (!token) {

        document.getElementById("status").textContent =
            "Generate an email first.";

        return;

    }

    document.getElementById("status").textContent =
        "Refreshing inbox...";

    checkInbox();

}


function startTimer() {

    clearInterval(countdown);

    let seconds = 600;

    updateTimer(seconds);

    countdown = setInterval(() => {

        seconds--;

        updateTimer(seconds);

        if (seconds <= 0) {

            clearInterval(countdown);

            clearInterval(inboxTimer);

            document.getElementById("status").textContent =
                "This temporary email has expired.";

        }

    }, 1000);

}


function updateTimer(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") +
        ":" +
        String(remainingSeconds).padStart(2, "0");

}

</script>

</body>
</html>
