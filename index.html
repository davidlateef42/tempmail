<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Mail Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #111827;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .app {
            width: 90%;
            max-width: 420px;
            margin: 40px auto;
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        #emailBox {
            background: #0b1220;
            padding: 14px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 16px;
            word-break: break-all;
        }

        #timer {
            margin: 10px 0;
            color: #fbbf24;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .generate {
            background: #22c55e;
        }

        .copy {
            background: #3b82f6;
            color: white;
        }

        .refresh {
            background: #6b7280;
            color: white;
        }

        .inbox {
            margin-top: 15px;
            background: #0b1220;
            padding: 10px;
            border-radius: 10px;
            height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .mail {
            background: #1f2937;
            margin: 6px 0;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .status {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>Temp Mail Pro</header>

<div class="app">

    <h3>Your Temporary Email</h3>

    <div id="emailBox">
        Click generate to create email
    </div>

    <div id="timer">
        Time left: 10:00
    </div>

    <button class="generate" onclick="generateEmail()">
        Generate Email
    </button>

    <button class="copy" onclick="copyEmail()">
        Copy Email
    </button>

    <button class="refresh" onclick="refreshInbox()">
        Refresh Inbox
    </button>

    <div class="status" id="status">
        Ready
    </div>

    <h4 id="inboxTitle">Inbox (0)</h4>

    <div class="inbox" id="inbox">
        No emails yet...
    </div>

</div>

<script>
    const API = "https://api.mail.tm";

    let token = null;
    let currentEmail = null;
    let countdown = null;
    let inboxTimer = null;
    let time = 600;

    async function generateEmail() {

        try {

            clearInterval(countdown);
            clearInterval(inboxTimer);

            document.getElementById("status").innerText =
                "Creating mailbox...";

            const domainResponse = await fetch(API + "/domains?page=1");

            if (!domainResponse.ok) {
                throw new Error("Could not get email domain.");
            }

            const domainData = await domainResponse.json();

            if (!domainData["hydra:member"] ||
                domainData["hydra:member"].length === 0) {
                throw new Error("No email domain available.");
            }

            const domain =
                domainData["hydra:member"][0].domain;

            const username =
                "user" + Math.random().toString(36).substring(2, 10);

            const password =
                "Tmp" + Math.random().toString(36).substring(2, 14) + "A1!";

            currentEmail = username + "@" + domain;

            const accountResponse = await fetch(API + "/accounts", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    address: currentEmail,
                    password: password
                })
            });

            if (!accountResponse.ok) {
                throw new Error("Could not create mailbox.");
            }

            const tokenResponse = await fetch(API + "/token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    address: currentEmail,
                    password: password
                })
            });

            if (!tokenResponse.ok) {
                throw new Error("Could not create mailbox token.");
            }

            const tokenData = await tokenResponse.json();

            token = tokenData.token;

            document.getElementById("emailBox").innerText =
                currentEmail;

            document.getElementById("status").innerText =
                "Mailbox ready";

            document.getElementById("inbox").innerHTML =
                "Waiting for incoming emails...";

            document.getElementById("inboxTitle").innerText =
                "Inbox (0)";

            startTimer();
            checkInbox();

            inboxTimer = setInterval(checkInbox, 5000);

        } catch (error) {

            console.error(error);

            document.getElementById("status").innerText =
                "Error: " + error.message;

            alert(
                "We could not create the mailbox. Please try again."
            );
        }
    }

    async function checkInbox() {

        if (!token) {
            return;
        }

        try {

            const response = await fetch(API + "/messages", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                return;
            }

            const data = await response.json();

            const messages =
                data["hydra:member"] || [];

            const inbox =
                document.getElementById("inbox");

            inbox.innerHTML = "";

            if (messages.length === 0) {

                inbox.innerHTML =
                    "No emails yet...";

            } else {

                messages.forEach(message => {

                    const div =
                        document.createElement("div");

                    div.className = "mail";

                    div.innerText =
                        "From: " +
                        (message.from?.address || "Unknown") +
                        "\n\n" +
                        (message.subject || "(No subject)");

                    inbox.appendChild(div);
                });
            }

            document.getElementById("inboxTitle").innerText =
                "Inbox (" + messages.length + ")";

        } catch (error) {

            console.error(error);
        }
    }

    function copyEmail() {

        if (!currentEmail) {
            alert("Generate an email first!");
            return;
        }

        navigator.clipboard.writeText(currentEmail)
            .then(() => {
                alert("Email copied!");
            })
            .catch(() => {
                alert("Copy failed. Please copy it manually.");
            });
    }

    function refreshInbox() {

        if (!token) {
            alert("Generate an email first!");
            return;
        }

        checkInbox();

        document.getElementById("status").innerText =
            "Inbox refreshed";
    }

    function startTimer() {

        time = 600;

        updateTimer();

        countdown = setInterval(() => {

            time--;

            updateTimer();

            if (time <= 0) {

                clearInterval(countdown);
                clearInterval(inboxTimer);

                document.getElementById("timer").innerText =
                    "Expired";

                document.getElementById("status").innerText =
                    "Mailbox session expired";
            }

        }, 1000);
    }

    function updateTimer() {

        const minutes =
            Math.floor(time / 60);

        const seconds =
            time % 60;

        document.getElementById("timer").innerText =
            "Time left: " +
            minutes +
            ":" +
            (seconds < 10 ? "0" + seconds : seconds);
    }
</script>

</body>
</html>
