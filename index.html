<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temp Mail Pro</title>

<style>

/* ========================================
   GLOBAL
======================================== */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #172033;
    padding: 25px 15px;
}

/* ========================================
   MAIN CONTAINER
======================================== */

.container {
    width: 100%;
    max-width: 720px;
    margin: auto;
    background: rgba(255,255,255,0.96);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(15,23,42,0.12);
}

/* ========================================
   HEADER
======================================== */

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
    color: #111827;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 8px 0 25px;
    font-size: 15px;
}

/* ========================================
   EMAIL CARD
======================================== */

.email-card {
    background: linear-gradient(135deg, #111827, #263449);
    color: white;
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 18px;
}

.email-label {
    font-size: 13px;
    opacity: 0.75;
    margin-bottom: 8px;
}

.email-box {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    font-size: 18px;
    word-break: break-all;
}

/* ========================================
   TIMER
======================================== */

.timer-section {
    text-align: center;
    margin: 22px 0;
}

.timer-label {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 5px;
}

.timer {
    font-size: 32px;
    font-weight: bold;
    color: #111827;
    letter-spacing: 2px;
}

/* ========================================
   BUTTONS
======================================== */

.button-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
}

button {
    border: none;
    padding: 12px 17px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: 0.2s;
    background: #111827;
    color: white;
}

button:hover {
    transform: translateY(-1px);
    opacity: 0.92;
}

button:active {
    transform: translateY(0);
}

.generate-btn {
    background: #2563eb;
}

.copy-btn {
    background: #059669;
}

.refresh-btn {
    background: #7c3aed;
}

/* ========================================
   STATUS
======================================== */

.status {
    text-align: center;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #64748b;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    margin: 15px 0 25px;
}

/* ========================================
   INBOX HEADER
======================================== */

.inbox-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 12px;
}

.inbox-header h2 {
    margin: 0;
    font-size: 22px;
}

.inbox-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 27px;
    height: 27px;
    background: #2563eb;
    color: white;
    padding: 4px 9px;
    border-radius: 50px;
    font-size: 13px;
    margin-left: 5px;
}

.last-checked {
    text-align: right;
    color: #94a3b8;
    font-size: 12px;
    margin: 10px 0;
}

/* ========================================
   INBOX
======================================== */

#inbox {
    color: #64748b;
    line-height: 1.5;
}

.message {
    position: relative;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 17px;
    margin: 12px 0;
    border-radius: 14px;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(15,23,42,0.04);
}

.message:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    border-color: #cbd5e1;
}

.message strong {
    color: #111827;
}

.message-preview {
    display: block;
    margin-top: 8px;
    color: #64748b;
    word-break: break-word;
}

.message-open {
    display: inline-block;
    margin-top: 12px;
    color: #2563eb;
    font-weight: bold;
    font-size: 13px;
}

.new-label {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 10px;
    margin-left: 5px;
    vertical-align: middle;
}

.received-time {
    color: #94a3b8;
    font-size: 12px;
}

.inbox-delete {
    background: #dc2626 !important;
    font-size: 12px;
    padding: 9px 12px;
    margin-top: 12px;
}

/* ========================================
   EMPTY INBOX
======================================== */

.empty-inbox {
    text-align: center;
    padding: 35px 15px;
    color: #94a3b8;
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 8px;
}

/* ========================================
   MESSAGE MODAL
======================================== */

.message-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.message-window {
    background: white;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}

.message-window h2 {
    margin-top: 0;
    color: #111827;
    word-break: break-word;
}

.message-info {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
}

.message-body {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 17px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.7;
    color: #334155;
    word-break: break-word;
    margin-top: 15px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-buttons button {
    flex: 1;
}

.close-btn {
    background: #475569;
}

.delete-message-btn {
    background: #dc2626;
}

/* ========================================
   FOOTER
======================================== */

.footer {
    text-align: center;
    color: #94a3b8;
    font-size: 12px;
    margin-top: 25px;
}

/* ========================================
   MOBILE
======================================== */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 20px 15px;
        border-radius: 18px;
    }

    .logo {
        font-size: 34px;
    }

    h1 {
        font-size: 26px;
    }

    .email-box {
        font-size: 16px;
    }

    .button-row {
        flex-direction: column;
    }

    .button-row button {
        width: 100%;
        margin: 0;
    }

    .timer {
        font-size: 28px;
    }

    .message-window {
        padding: 20px;
        max-height: 90vh;
    }

    .modal-buttons {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="logo">📧</div>

    <h1>Temp Mail Pro</h1>

    <p class="subtitle">
        Fast, simple and temporary email
    </p>


    <!-- EMAIL -->

    <div class="email-card">

        <div class="email-label">
            YOUR TEMPORARY EMAIL
        </div>

        <div class="email-box" id="email">
            Click "Generate Email"
        </div>

    </div>


    <!-- TIMER -->

    <div class="timer-section">

        <div class="timer-label">
            EMAIL EXPIRES IN
        </div>

        <div class="timer" id="timer">
            60:00
        </div>

    </div>


    <!-- BUTTONS -->

    <div class="button-row">

        <button
            class="generate-btn"
            onclick="generateEmail()">
            ✨ Generate Email
        </button>

        <button
            class="copy-btn"
            onclick="copyEmail()">
            📋 Copy Email
        </button>

        <button
            class="refresh-btn"
            onclick="refreshInbox()">
            🔄 Refresh Inbox
        </button>

    </div>


    <!-- STATUS -->

    <div class="status" id="status">
        No email generated yet.
    </div>


    <!-- INBOX -->

    <div class="inbox-header">

        <h2>
            📬 Inbox

            <span
                class="inbox-count"
                id="inboxCount">
                0
            </span>

        </h2>

    </div>

    <div
        class="last-checked"
        id="lastChecked">
        Not checked yet
    </div>

    <div id="inbox">

        <div class="empty-inbox">

            <div class="empty-icon">
                📭
            </div>

            Your messages will appear here.

        </div>

    </div>


    <div class="footer">
        Temp Mail Pro • Temporary email made simple
    </div>

</div>


<script>

const API = "https://mailboxtemp.com";


// ========================================
// READ / UNREAD SYSTEM
// ========================================

function isMessageRead(messageId) {

    const readMessages = JSON.parse(
        localStorage.getItem("readMessages") || "[]"
    );

    return readMessages.includes(String(messageId));
}


function markMessageAsRead(messageId) {

    const readMessages = JSON.parse(
        localStorage.getItem("readMessages") || "[]"
    );

    if (!readMessages.includes(String(messageId))) {

        readMessages.push(String(messageId));

    }

    localStorage.setItem(
        "readMessages",
        JSON.stringify(readMessages)
    );
}


// ========================================
// MAIN VARIABLES
// ========================================

let currentEmail = null;

let countdown;

let inboxTimer;


// ========================================
// GENERATE EMAIL
// ========================================

async function generateEmail() {

    const status =
        document.getElementById("status");

    status.textContent =
        "Creating your temporary email...";

    try {

        const response = await fetch(
            API + "/api/inbox/generate",
            {
                method: "POST"
            }
        );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Could not create inbox"
            );

        }

        currentEmail =
            data.address;

        document.getElementById("email")
            .textContent =
            currentEmail;

        status.textContent =
            "Email created successfully!";

        document.getElementById("inbox")
            .innerHTML = `
                <div class="empty-inbox">
                    <div class="empty-icon">📨</div>
                    Waiting for incoming messages...
                </div>
            `;

        document.getElementById("inboxCount")
            .textContent =
            "0";

        document.getElementById("lastChecked")
            .textContent =
            "Not checked yet";

        startTimer(3600);

        await checkInbox();

        clearInterval(inboxTimer);

        inboxTimer =
            setInterval(
                checkInbox,
                5000
            );

    } catch (error) {

        console.error(error);

        status.textContent =
            "Could not create email: " +
            error.message;

    }

}


// ========================================
// CHECK INBOX
// ========================================

async function checkInbox() {

    if (!currentEmail) return;

    try {

        const response = await fetch(
            API + "/api/inbox/" +
            encodeURIComponent(currentEmail) +
            "/emails"
        );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Inbox error"
            );

        }

        const inbox =
            document.getElementById("inbox");

        const messages =
            data.emails || [];


        // ========================================
        // LAST CHECKED
        // ========================================

        const now =
            new Date();

        document.getElementById("lastChecked")
            .textContent =
            "Last checked: " +
            now.toLocaleTimeString();


        // ========================================
        // NO MESSAGES
        // ========================================

        if (messages.length === 0) {

            document.getElementById("inboxCount")
                .textContent =
                "0";

            inbox.innerHTML = `
                <div class="empty-inbox">

                    <div class="empty-icon">
                        📭
                    </div>

                    No messages yet.
                    <br>
                    Waiting for new mail...

                </div>
            `;

            return;

        }


        // ========================================
        // COUNT UNREAD
        // ========================================

        const unreadCount =
            messages.filter(
                message =>
                    !isMessageRead(message.id)
            ).length;


        document.getElementById("inboxCount")
            .textContent =
            unreadCount;


        // ========================================
        // CLEAR INBOX
        // ========================================

        inbox.innerHTML = "";


        // ========================================
        // DISPLAY MESSAGES
        // ========================================

        messages.forEach(message => {

            const div =
                document.createElement("div");

            div.className =
                "message";


            const unread =
                !isMessageRead(message.id);


            if (unread) {

                div.style.borderLeft =
                    "5px solid #2563eb";

            }


            div.style.cursor =
                "pointer";


            // ========================================
            // NEW LABEL
            // ========================================

            const newLabel =
                unread
                ? '<span class="new-label">NEW</span>'
                : "";


            // ========================================
            // RECEIVED TIME
            // ========================================

            const receivedValue =
                message.received_at ||
                message.created_at ||
                message.timestamp ||
                message.date ||
                message.sent_at;


            let receivedTime = "";


            if (receivedValue) {

                const parsedDate =
                    new Date(receivedValue);

                if (!isNaN(parsedDate)) {

                    receivedTime =
                        '<br><span class="received-time">' +
                        '🕐 Received: ' +
                        parsedDate.toLocaleString() +
                        '</span>';

                }

            }


            // ========================================
            // MESSAGE PREVIEW
            // ========================================

            const preview =
                message.preview ||
                message.snippet ||
                message.body ||
                message.text ||
                message.content ||
                message.text_body ||
                message.body_text ||
                message.message ||
                "Message received — click to open.";


            div.innerHTML = `

                <strong>
                    ${escapeHtml(
                        message.subject ||
                        "No subject"
                    )}
                </strong>

                ${newLabel}

                <br><br>

                <span style="color:#64748b;">
                    From:
                    ${escapeHtml(
                        message.from_address ||
                        "Unknown"
                    )}
                </span>

                ${
                    message.otp_code
                    ? `
                        <br>
                        <strong>
                            OTP:
                            ${escapeHtml(
                                message.otp_code
                            )}
                        </strong>
                    `
                    : ""
                }

                ${receivedTime}

                <span class="message-preview">
                    ${escapeHtml(preview)}
                </span>

                <span class="message-open">
                    Click to open →
                </span>

            `;


            // ========================================
            // DELETE BUTTON
            // ========================================

            const inboxDeleteButton =
                document.createElement("button");

            inboxDeleteButton.textContent =
                "🗑️ Delete";

            inboxDeleteButton.className =
                "inbox-delete";


            inboxDeleteButton.onclick =
                async function(event) {

                    event.stopPropagation();

                    try {

                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                ),
                                {
                                    method: "DELETE"
                                }
                            );

                        const data =
                            await response.json();

                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not delete email"
                            );

                        }

                        div.remove();


                        const currentCount =
                            parseInt(
                                document
                                .getElementById(
                                    "inboxCount"
                                )
                                .textContent
                            ) || 0;


                        if (
                            unread &&
                            currentCount > 0
                        ) {

                            document
                            .getElementById(
                                "inboxCount"
                            )
                            .textContent =
                            currentCount - 1;

                        }

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not delete this email: " +
                            error.message
                        );

                    }

                };


            div.appendChild(
                inboxDeleteButton
            );


            // ========================================
            // OPEN MESSAGE
            // ========================================

            div.onclick =
                async function() {

                    try {

                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                )
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not open email"
                            );

                        }


                        const email =
                            data.email;


                        // ========================================
                        // MARK READ
                        // ========================================

                        markMessageAsRead(
                            message.id
                        );


                        div.style.borderLeft =
                            "";


                        const countElement =
                            document.getElementById(
                                "inboxCount"
                            );


                        const currentCount =
                            parseInt(
                                countElement.textContent
                            ) || 0;


                        if (currentCount > 0) {

                            countElement.textContent =
                                currentCount - 1;

                        }


                        // ========================================
                        // MESSAGE OVERLAY
                        // ========================================

                        const fullMessage =
                            document.createElement(
                                "div"
                            );

                        fullMessage.className =
                            "message-overlay";


                        // ========================================
                        // MESSAGE WINDOW
                        // ========================================

                        const messageWindow =
                            document.createElement(
                                "div"
                            );

                        messageWindow.className =
                            "message-window";


                        messageWindow.innerHTML = `

                            <h2>
                                ${escapeHtml(
                                    email.subject ||
                                    "No subject"
                                )}
                            </h2>

                            <div class="message-info">

                                <strong>From:</strong>
                                ${escapeHtml(
                                    email.from_address ||
                                    "Unknown"
                                )}

                                ${
                                    email.otp_code
                                    ? `
                                        <br>

                                        <strong>
                                            OTP:
                                        </strong>

                                        ${escapeHtml(
                                            email.otp_code
                                        )}
                                    `
                                    : ""
                                }

                            </div>

                            <div class="message-body">

                                ${escapeHtml(
                                    email.body_text ||
                                    email.body ||
                                    email.text ||
                                    "No message content available."
                                )}

                            </div>

                        `;


                        // ========================================
                        // MODAL BUTTONS
                        // ========================================

                        const modalButtons =
                            document.createElement(
                                "div"
                            );

                        modalButtons.className =
                            "modal-buttons";


                        // CLOSE

                        const closeButton =
                            document.createElement(
                                "button"
                            );

                        closeButton.textContent =
                            "Close";

                        closeButton.className =
                            "close-btn";


                        closeButton.onclick =
                            function() {

                                fullMessage.remove();

                            };


                        // DELETE

                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.textContent =
                            "🗑️ Delete Message";

                        deleteButton.className =
                            "delete-message-btn";


                        deleteButton.onclick =
                            async function() {

                                try {

                                    const response =
                                        await fetch(
                                            API +
                                            "/api/email/" +
                                            encodeURIComponent(
                                                currentEmail
                                            ) +
                                            "/" +
                                            encodeURIComponent(
                                                message.id
                                            ),
                                            {
                                                method:
                                                    "DELETE"
                                            }
                                        );


                                    const data =
                                        await response.json();


                                    if (
                                        !response.ok ||
                                        !data.ok
                                    ) {

                                        throw new Error(
                                            data.error ||
                                            "Could not delete email"
                                        );

                                    }


                                    fullMessage.remove();

                                    div.remove();

                                } catch (error) {

                                    console.error(
                                        error
                                    );

                                    alert(
                                        "Could not delete this email: " +
                                        error.message
                                    );

                                }

                            };


                        modalButtons.appendChild(
                            closeButton
                        );

                        modalButtons.appendChild(
                            deleteButton
                        );


                        messageWindow.appendChild(
                            modalButtons
                        );


                        fullMessage.appendChild(
                            messageWindow
                        );


                        document.body.appendChild(
                            fullMessage
                        );


                        // Close when clicking outside

                        fullMessage.onclick =
                            function(event) {

                                if (
                                    event.target ===
                                    fullMessage
                                ) {

                                    fullMessage.remove();

                                }

                            };


                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not open this email: " +
                            error.message
                        );

                    }

                };


            inbox.appendChild(div);

        });

    } catch (error) {

        console.error(error);

    }

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


// ========================================
// COPY EMAIL
// ========================================

function copyEmail() {

    if (!currentEmail) {

        alert(
            "Generate an email first."
        );

        return;

    }

    navigator.clipboard.writeText(
        currentEmail
    );

    document.getElementById("status")
        .textContent =
        "Email copied!";

}


// ========================================
// MANUAL REFRESH
// ========================================

function refreshInbox() {

    if (!currentEmail) {

        document.getElementById("status")
            .textContent =
            "Generate an email first.";

        return;

    }

    document.getElementById("status")
        .textContent =
        "Refreshing inbox...";

    checkInbox().then(() => {

        document.getElementById("status")
            .textContent =
            "Inbox refreshed!";

    });

}


// ========================================
// TIMER
// ========================================

function startTimer(seconds) {

    clearInterval(countdown);

    updateTimer(seconds);


    countdown =
        setInterval(() => {

            seconds--;

            updateTimer(seconds);


            if (seconds <= 0) {

                clearInterval(
                    countdown
                );

                clearInterval(
                    inboxTimer
                );

                document.getElementById(
                    "status"
                ).textContent =
                    "This temporary email has expired.";

            }

        }, 1000);

}


// ========================================
// UPDATE TIMER
// ========================================

function updateTimer(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(remainingSeconds)
            .padStart(2, "0");

}

</script>

</body>
</html>
