<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temp Mail Pro</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    color: #172033;
    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 720px;
    margin: auto;
    background: rgba(255,255,255,0.97);
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(15,23,42,0.12);
}

.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 5px;
}

h1 {
    text-align: center;

    font-size: 32px;
    color: #111827;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 8px 0 25px;
    font-size: 15px;
}

.email-card {
    background: linear-gradient(135deg, #111827, #263449);
    color: white;
    padding: 22px;

}

.email-label {

    border: 1px solid rgba(255,255,255,0.15);

}

    text-align: center;
    margin: 22px 0;
}

.timer-label {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 5px;
}

.timer {
    font-size: 32px;
    font-weight: bold;
    color: #111827;
    letter-spacing: 2px;
}

.button-row {

    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
}

button {
    border: none;
    padding: 12px 17px;

    cursor: pointer;
    font-size: 14px;

button:hover:not(:disabled) {
    transform: translateY(-1px);
    opacity: 0.92;

    transform: translateY(0);

button:disabled {
    opacity: 0.55;

.generate-btn {

    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.inbox-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 12px;
}

.inbox-header h2 {
    margin: 0;
    font-size: 22px;
}

.inbox-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 27px;
    height: 27px;
    background: #2563eb;

    padding: 4px 9px;
    border-radius: 50px;
    font-size: 13px;
    margin-left: 5px;
}

    text-align: right;

}

#inbox {
    color: #64748b;
    line-height: 1.5;
}

.message {
    position: relative;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 17px;
    margin: 12px 0;
    border-radius: 14px;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(15,23,42,0.04);
}

.message:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(15,23,42,0.08);

.message strong {
    color: #111827;
}

.message-preview {
    display: block;

}

    display: inline-block;

    color: #2563eb;

    font-size: 13px;
}

    display: inline-block;
    background: #2563eb;

    padding: 4px 8px;
    border-radius: 20px;

    margin-left: 5px;
    vertical-align: middle;
}

.received-time {
    color: #94a3b8;
    font-size: 12px;
}

.inbox-delete {
    background: #dc2626 !important;
    font-size: 12px;
    padding: 9px 12px;
    margin-top: 12px;
}

.empty-inbox {
    text-align: center;
    padding: 35px 15px;
    color: #94a3b8;
}

.empty-icon {
    font-size: 38px;
    margin-bottom: 8px;
}

.message-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

}

.message-window h2 {

}

.message-info {
    color: #64748b;
    font-size: 14px;

}

.message-body {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 17px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.7;
    color: #334155;
    word-break: break-word;
    margin-top: 15px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-buttons button {

}

.close-btn {
    background: #475569;
}

.delete-message-btn {

}

    text-align: center;

    font-size: 12px;
    margin-top: 25px;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 20px 15px;
        border-radius: 18px;
    }

    .logo {
        font-size: 34px;
    }

    h1 {
        font-size: 26px;
    }

    .email-box {
        font-size: 16px;
    }

    .button-row {
        flex-direction: column;
    }

    .button-row button {
        width: 100%;
    }

    .timer {
        font-size: 28px;
    }

    .message-window {
        padding: 20px;
        max-height: 90vh;
    }

    .modal-buttons {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">📧</div>

    <h1>Temp Mail Pro</h1>

    <p class="subtitle">
        Fast, simple and temporary email
    </p>

    <div class="email-card">

        <div class="email-label">
            YOUR TEMPORARY EMAIL
        </div>

        <div class="email-box" id="email">
            Click "Generate Email"
        </div>

    </div>

    <div class="timer-section">

        <div class="timer-label">
            EMAIL EXPIRES IN
        </div>

        <div class="timer" id="timer">
            60:00
        </div>

    </div>

    <div class="button-row">

        <button
            id="generateBtn"
            class="generate-btn"
            onclick="generateEmail()">
            ✨ Generate Email
        </button>

        <button
            id="copyBtn"
            class="copy-btn"
            onclick="copyEmail()">
            📋 Copy Email
        </button>

        <button
            id="refreshBtn"
            class="refresh-btn"
            onclick="refreshInbox()">
            🔄 Refresh Inbox
        </button>

    </div>

    <div class="status" id="status">
        No email generated yet.
    </div>

    <div class="inbox-header">

        <h2>
            📬 Inbox

            <span
                class="inbox-count"
                id="inboxCount">
                0
            </span>
        </h2>

    </div>

    <div
        class="last-checked"
        id="lastChecked">
        Not checked yet
    </div>

    <div id="inbox">

        <div class="empty-inbox">

            <div class="empty-icon">
                📭
            </div>

            Your messages will appear here.

        </div>

    </div>

    <div class="footer">
        Temp Mail Pro • Temporary email made simple
    </div>

</div>

<script>

const API = "https://mailboxtemp.com";

let currentEmail = null;
let countdown = null;
let inboxTimer = null;
let emailExpired = false;


/* ========================================
   BUTTONS
======================================== */

const generateBtn =
    document.getElementById("generateBtn");

const copyBtn =
    document.getElementById("copyBtn");

const refreshBtn =
    document.getElementById("refreshBtn");


function setButtonsDisabled(disabled) {

    generateBtn.disabled = disabled;
    copyBtn.disabled = disabled;
    refreshBtn.disabled = disabled;

}


/* ========================================
   STATUS
======================================== */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

}


/* ========================================
   READ / UNREAD
======================================== */

function isMessageRead(messageId) {

    const readMessages =
        JSON.parse(
            localStorage.getItem("readMessages") || "[]"
        );

    return readMessages.includes(
        String(messageId)
    );
}


function markMessageAsRead(messageId) {

    const readMessages =
        JSON.parse(
            localStorage.getItem("readMessages") || "[]"
        );

    if (!readMessages.includes(String(messageId))) {

        readMessages.push(
            String(messageId)
        );

    }

    localStorage.setItem(
        "readMessages",
        JSON.stringify(readMessages)
    );

}


/* ========================================
   GENERATE EMAIL
======================================== */

async function generateEmail() {

    if (generateBtn.disabled) return;

    setButtonsDisabled(true);

    setStatus(
        "Creating your temporary email..."
    );

    try {

        clearInterval(inboxTimer);
        clearInterval(countdown);

        const response =
            await fetch(
                API + "/api/inbox/generate",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Could not create inbox."
            );

        }

        currentEmail =
            data.address;

        emailExpired = false;

        document.getElementById("email")
            .textContent =
            currentEmail;

        document.getElementById("inbox")
            .innerHTML = `
                <div class="empty-inbox">
                    <div class="empty-icon">📨</div>
                    Waiting for incoming messages...
                </div>
            `;

        document.getElementById("inboxCount")
            .textContent = "0";

        document.getElementById("lastChecked")
            .textContent = "Not checked yet";

        startTimer(3600);

        setStatus(
            "Email created successfully!"
        );

        await checkInbox();

        inboxTimer =
            setInterval(
                checkInbox,
                5000
            );

    } catch (error) {

        console.error(error);

        setStatus(
            "Could not create email: " +
            error.message
        );

    } finally {

        setButtonsDisabled(false);

    }

}


/* ========================================
   CHECK INBOX
======================================== */

async function checkInbox() {

    if (!currentEmail || emailExpired) {
        return;
    }

    try {

        const response =
            await fetch(
                API +
                "/api/inbox/" +
                encodeURIComponent(
                    currentEmail
                ) +
                "/emails"
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {

            throw new Error(
                data.error ||
                "Inbox error."
            );

        }

        const messages =
            data.emails || [];

        document.getElementById(
            "lastChecked"
        ).textContent =
            "Last checked: " +
            new Date().toLocaleTimeString();


        if (messages.length === 0) {

            document.getElementById(
                "inboxCount"
            ).textContent = "0";

            document.getElementById(
                "inbox"
            ).innerHTML = `
                <div class="empty-inbox">

                    <div class="empty-icon">
                        📭
                    </div>

                    No messages yet.
                    <br>
                    Waiting for new mail...

                </div>
            `;

            return;
        }


        const unreadCount =
            messages.filter(
                message =>
                    !isMessageRead(message.id)
            ).length;


        document.getElementById(
            "inboxCount"
        ).textContent =
            unreadCount;


        const inbox =
            document.getElementById("inbox");

        inbox.innerHTML = "";


        messages.forEach(message => {

            const div =
                document.createElement("div");

            div.className = "message";

            div.style.cursor = "pointer";


            const unread =
                !isMessageRead(message.id);


            if (unread) {

                div.style.borderLeft =
                    "5px solid #2563eb";

            }


            const newLabel =
                unread
                ? '<span class="new-label">NEW</span>'
                : "";


            const receivedValue =
                message.received_at ||
                message.created_at ||
                message.timestamp ||
                message.date ||
                message.sent_at;


            let receivedTime = "";


            if (receivedValue) {

                const parsedDate =
                    new Date(receivedValue);

                if (!isNaN(parsedDate)) {

                    receivedTime =
                        '<br><span class="received-time">' +
                        '🕐 Received: ' +
                        parsedDate.toLocaleString() +
                        '</span>';

                }

            }


            const preview =
                message.preview ||
                message.snippet ||
                message.body ||
                message.text ||
                message.content ||
                message.text_body ||
                message.body_text ||
                message.message ||
                "Message received — click to open.";


            div.innerHTML = `

                <strong>
                    ${escapeHtml(
                        message.subject ||
                        "No subject"
                    )}
                </strong>

                ${newLabel}

                <br><br>

                <span style="color:#64748b;">
                    From:
                    ${escapeHtml(
                        message.from_address ||
                        "Unknown"
                    )}
                </span>

                ${
                    message.otp_code
                    ? `
                        <br>
                        <strong>
                            OTP:
                            ${escapeHtml(
                                message.otp_code
                            )}
                        </strong>
                    `
                    : ""
                }

                ${receivedTime}

                <span class="message-preview">
                    ${escapeHtml(preview)}
                </span>

                <span class="message-open">
                    Click to open →
                </span>

            `;


            /* ========================================
               INBOX DELETE
            ======================================== */

            const inboxDeleteButton =
                document.createElement("button");

            inboxDeleteButton.textContent =
                "🗑️ Delete";

            inboxDeleteButton.className =
                "inbox-delete";


            inboxDeleteButton.onclick =
                async function(event) {

                    event.stopPropagation();

                    try {

                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                ),
                                {
                                    method: "DELETE"
                                }
                            );

                        const data =
                            await response.json();

                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not delete email."
                            );

                        }

                        div.remove();

                        if (unread) {

                            const count =
                                parseInt(
                                    document.getElementById(
                                        "inboxCount"
                                    ).textContent
                                ) || 0;

                            document.getElementById(
                                "inboxCount"
                            ).textContent =
                                Math.max(
                                    0,
                                    count - 1
                                );

                        }

                        setStatus(
                            "Message deleted."
                        );

                    } catch (error) {

                        console.error(error);

                        setStatus(
                            "Could not delete message: " +
                            error.message
                        );

                    }

                };


            div.appendChild(
                inboxDeleteButton
            );


            /* ========================================
               OPEN MESSAGE
            ======================================== */

            div.onclick =
                async function() {

                    try {

                        setStatus(
                            "Opening message..."
                        );


                        const response =
                            await fetch(
                                API +
                                "/api/email/" +
                                encodeURIComponent(
                                    currentEmail
                                ) +
                                "/" +
                                encodeURIComponent(
                                    message.id
                                )
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.ok
                        ) {

                            throw new Error(
                                data.error ||
                                "Could not open email."
                            );

                        }


                        const email =
                            data.email;


                        markMessageAsRead(
                            message.id
                        );


                        div.style.borderLeft =
                            "";


                        const countElement =
                            document.getElementById(
                                "inboxCount"
                            );


                        const currentCount =
                            parseInt(
                                countElement.textContent
                            ) || 0;


                        if (unread && currentCount > 0) {

                            countElement.textContent =
                                currentCount - 1;

                        }


                        /* ========================================
                           OVERLAY
                        ======================================== */

                        const fullMessage =
                            document.createElement(
                                "div"
                            );

                        fullMessage.className =
                            "message-overlay";


                        const messageWindow =
                            document.createElement(
                                "div"
                            );

                        messageWindow.className =
                            "message-window";


                        messageWindow.innerHTML = `

                            <h2>
                                ${escapeHtml(
                                    email.subject ||
                                    "No subject"
                                )}
                            </h2>

                            <div class="message-info">

                                <strong>From:</strong>
                                ${escapeHtml(
                                    email.from_address ||
                                    "Unknown"
                                )}

                                ${
                                    email.otp_code
                                    ? `
                                        <br>
                                        <strong>
                                            OTP:
                                        </strong>

                                        ${escapeHtml(
                                            email.otp_code
                                        )}
                                    `
                                    : ""
                                }

                            </div>

                            <div class="message-body">

                                ${escapeHtml(
                                    email.body_text ||
                                    email.body ||
                                    email.text ||
                                    "No message content available."
                                )}

                            </div>

                        `;


                        const modalButtons =
                            document.createElement(
                                "div"
                            );

                        modalButtons.className =
                            "modal-buttons";


                        /* ========================================
                           CLOSE
                        ======================================== */

                        const closeButton =
                            document.createElement(
                                "button"
                            );

                        closeButton.textContent =
                            "Close";

                        closeButton.className =
                            "close-btn";


                        closeButton.onclick =
                            function() {

                                fullMessage.remove();

                            };


                        /* ========================================
                           DELETE
                        ======================================== */

                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.textContent =
                            "🗑️ Delete Message";

                        deleteButton.className =
                            "delete-message-btn";


                        deleteButton.onclick =
                            async function() {

                                deleteButton.disabled =
                                    true;

                                deleteButton.textContent =
                                    "Deleting...";

                                try {

                                    const response =
                                        await fetch(
                                            API +
                                            "/api/email/" +
                                            encodeURIComponent(
                                                currentEmail
                                            ) +
                                            "/" +
                                            encodeURIComponent(
                                                message.id
                                            ),
                                            {
                                                method:
                                                    "DELETE"
                                            }
                                        );


                                    const data =
                                        await response.json();


                                    if (
                                        !response.ok ||
                                        !data.ok
                                    ) {

                                        throw new Error(
                                            data.error ||
                                            "Could not delete email."
                                        );

                                    }


                                    fullMessage.remove();

                                    div.remove();

                                    setStatus(
                                        "Message deleted successfully."
                                    );

                                } catch (error) {

                                    console.error(
                                        error
                                    );

                                    deleteButton.disabled =
                                        false;

                                    deleteButton.textContent =
                                        "🗑️ Delete Message";

                                    setStatus(
                                        "Could not delete message: " +
                                        error.message
                                    );

                                }

                            };


                        modalButtons.appendChild(
                            closeButton
                        );

                        modalButtons.appendChild(
                            deleteButton
                        );


                        messageWindow.appendChild(
                            modalButtons
                        );


                        fullMessage.appendChild(
                            messageWindow
                        );


                        document.body.appendChild(
                            fullMessage
                        );


                        /* ========================================
                           CLICK OUTSIDE TO CLOSE
                        ======================================== */

                        fullMessage.onclick =
                            function(event) {

                                if (
                                    event.target ===
                                    fullMessage
                                ) {

                                    fullMessage.remove();

                                }

                            };


                        /* ========================================
                           ESC KEY
                        ======================================== */

                        function closeWithEscape(event) {

                            if (event.key === "Escape") {

                                fullMessage.remove();

                                document.removeEventListener(
                                    "keydown",
                                    closeWithEscape
                                );

                            }

                        }


                        document.addEventListener(
                            "keydown",
                            closeWithEscape
                        );


                    } catch (error) {

                        console.error(error);

                        setStatus(
                            "Could not open this email: " +
                            error.message
                        );

                    }

                };


            inbox.appendChild(div);

        });


        setStatus(
            messages.length +
            (messages.length === 1
                ? " message"
                : " messages") +
            " in inbox."
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Inbox connection error. Retrying automatically..."
        );

    }

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


/* ========================================
   COPY EMAIL
======================================== */

async function copyEmail() {

    if (!currentEmail) {

        setStatus(
            "Generate an email first."
        );

        return;

    }

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                currentEmail
            );

        } else {

            const textarea =
                document.createElement("textarea");

            textarea.value =
                currentEmail;

            textarea.style.position =
                "fixed";

            textarea.style.opacity =
                "0";

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand("copy");

            textarea.remove();

        }

        setStatus(
            "Email copied!"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "Could not copy email automatically."
        );

    }

}


/* ========================================
   REFRESH INBOX
======================================== */

async function refreshInbox() {

    if (!currentEmail) {

        setStatus(
            "Generate an email first."
        );

        return;

    }

    if (emailExpired) {

        setStatus(
            "This email has expired. Generate a new one."
        );

        return;

    }

    refreshBtn.disabled = true;

    setStatus(
        "Refreshing inbox..."
    );

    try {

        await checkInbox();

    } finally {

        refreshBtn.disabled = false;

    }

}


/* ========================================
   TIMER
======================================== */

function startTimer(seconds) {

    clearInterval(countdown);

    updateTimer(seconds);

    countdown =
        setInterval(() => {

            seconds--;

            updateTimer(seconds);


            if (seconds <= 0) {

                clearInterval(countdown);

                clearInterval(inboxTimer);

                emailExpired = true;

                setStatus(
                    "This temporary email has expired. Generate a new email to continue."
                );

                document.getElementById(
                    "timer"
                ).textContent =
                    "00:00";

            }

        }, 1000);

}


/* ========================================
   UPDATE TIMER
======================================== */

function updateTimer(seconds) {

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(remainingSeconds)
            .padStart(2, "0");

}

</script>
